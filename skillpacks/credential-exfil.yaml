name: credential-exfil
version: 0.1.0
severity:
  credential_path_with_network: block
  credential_path_only: prompt
signals:
  paths:
    - .ssh
    - .aws
    - .gcloud
    - .azure
    - .kube
    - .npmrc
    - .pypirc
    - .netrc
    - .env
    - .huggingface
  env:
    - OPENAI_API_KEY
    - ANTHROPIC_API_KEY
    - GITHUB_TOKEN
    - AWS_SECRET_ACCESS_KEY

